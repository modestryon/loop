<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>NEOUL × Modestry On</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-400.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-700.woff2) format("woff2")}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Outfit,Arial,sans-serif;color:#252820}
.wrap{display:flex;width:100vw;height:100vh}
.shop{flex:0 0 66.667%;height:100%;border:0;border-right:1.5px solid #D8D5CE;background:#fff}
.side{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,3.4vw,56px);background:#F6F5F1}
.k{font:500 clamp(11px,.95vw,15px)/1 Outfit;letter-spacing:.18em;text-transform:uppercase;color:#6A6862;display:flex;align-items:center;gap:10px}
.k b{width:28px;height:2px;background:#252820;display:inline-block}
h1{font-weight:700;font-size:clamp(30px,3.5vw,58px);line-height:1.02;letter-spacing:-.03em;margin:16px 0 0}
.qr{margin:clamp(20px,3.2vh,36px) 0 0;background:#fff;border-radius:20px;padding:clamp(14px,1.5vw,22px);width:min(100%,clamp(170px,19vw,300px));box-shadow:0 0 0 1.5px #D8D5CE}
.qr img{display:block;width:100%;height:auto}
.at{font-weight:700;font-size:clamp(22px,2.3vw,38px);letter-spacing:-.02em;margin:clamp(14px,2.2vh,24px) 0 0;display:flex;align-items:center;gap:.3em}
.sw{display:inline-block;width:.5em;height:.76em;border-radius:.25em;background:#252820;position:relative}
.sw i{position:absolute;left:14.5%;width:71%;aspect-ratio:1;border-radius:50%;top:9.6%;background:#DCF25A;box-shadow:0 0 .1em .025em rgba(220,242,90,.75)}
ul{list-style:none;padding:0;margin:clamp(18px,3vh,34px) 0 0;display:grid;gap:10px}
li{font-weight:500;font-size:clamp(14px,1.25vw,20px);line-height:1.25;padding:13px 16px;border-radius:13px;border:1.5px solid #E0DDD6;background:#fff}
li small{display:block;font:500 clamp(10px,.8vw,12px)/1 Outfit;letter-spacing:.16em;text-transform:uppercase;color:#8B8982;margin-bottom:6px}
</style></head><body>
<div class="wrap">
  <iframe class="shop" src="https://modestryon.github.io/neoul/#bawal" title="NEOUL Collection 01"></iframe>
  <aside class="side">
    <div class="k"><b></b>Follow on Instagram</div>
    <h1>Find Your<br>Best Hijab</h1>
    <div class="qr"><img src="qr-instagram.svg" alt="QR code to instagram.com/modestry_on"></div>
    <div class="at"><i class="sw"><i></i></i>@modestry_on</div>
    <ul>
      <li><small>Filming?</small>Tag @modestry_on in your video.</li>
      <li><small>Know someone who wears a hijab?</small>Send her our page.</li>
    </ul>
  </aside>
</div>
</body></html>
