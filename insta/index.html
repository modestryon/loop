<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Modestry On · Instagram</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-400.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-700.woff2) format("woff2")}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#F6F5F1;font-family:Outfit,Arial,sans-serif;color:#252820}
body{display:flex;justify-content:center}
.side{width:100%;max-width:600px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3.4vh,36px);padding:28px clamp(22px,7.5vw,48px)}
.k{font:500 clamp(10px,2.7vw,14px)/1 Outfit;letter-spacing:.18em;text-transform:uppercase;color:#6A6862;display:flex;align-items:center;gap:10px}
.k b{width:26px;height:2px;background:#252820;display:inline-block}
h1{font-weight:700;font-size:clamp(30px,10.6vw,60px);line-height:1.02;letter-spacing:-.03em;margin:14px 0 0}
h2{font-weight:700;font-size:clamp(24px,7.6vw,44px);line-height:1.06;letter-spacing:-.025em;margin:12px 0 0}
p{font-weight:400;font-size:clamp(15px,4.2vw,23px);line-height:1.3;color:#6A6862;margin:12px 0 0}
hr{border:0;border-top:1.5px solid #DAD7D0;margin:0;width:100%}
.row{display:flex;align-items:center;gap:clamp(14px,4.4vw,26px);margin-top:clamp(14px,2.2vh,24px)}
.qr{flex:0 0 auto;background:#fff;border-radius:18px;padding:clamp(10px,3vw,18px);width:clamp(130px,39vw,230px);box-shadow:0 0 0 1.5px #D8D5CE}
.qr img{display:block;width:100%;height:auto}
.how{font-weight:500;font-size:clamp(13px,3.7vw,20px);line-height:1.3}
.at{font-weight:700;font-size:clamp(18px,5.6vw,31px);letter-spacing:-.02em;display:flex;align-items:center;gap:.3em;margin-top:8px}
.sw{display:inline-block;width:.5em;height:.76em;border-radius:.25em;background:#252820;position:relative;flex:0 0 auto}
.sw i{position:absolute;left:14.5%;width:71%;aspect-ratio:1;border-radius:50%;top:9.6%;background:#DCF25A;box-shadow:0 0 .1em .025em rgba(220,242,90,.75)}
.chip{align-self:flex-start;font-weight:500;font-size:clamp(12px,3.4vw,18px);padding:11px 15px;border-radius:12px;border:1.5px solid #252820;background:#fff}
.chip small{font:500 clamp(9px,2.4vw,12px)/1 Outfit;letter-spacing:.16em;text-transform:uppercase;color:#8B8982;margin-right:10px}
@media (max-width:380px){.row{flex-direction:column;align-items:flex-start}}
</style></head><body>
<aside class="side">
  <div>
    <div class="k"><b></b>NEOUL × Modestry On</div>
    <h1>See it on you<br>before you buy.</h1>
    <p>Every scarf here has a Try On button.<br>One photo, five ways to wear it.</p>
  </div>
  <hr>
  <div>
    <div class="k"><b></b>We'd love your take</div>
    <h2>Which brand should we add next?</h2>
    <div class="row">
      <div class="qr"><img src="qr-instagram.svg" alt="QR code to instagram.com/modestry_on"></div>
      <div><div class="how">Scan, then comment<br>or DM us your pick.</div><div class="at"><i class="sw"><i></i></i>@modestry_on</div></div>
    </div>
  </div>
  <div class="chip"><small>Filming?</small>Tag @modestry_on</div>
</aside>
</body></html>
