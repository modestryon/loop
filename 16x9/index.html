<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="robots" content="noindex">
<title>Modestry On</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}</style></head>
<body><video id="v" src="loop.mp4" autoplay muted loop playsinline preload="auto"></video>
<script>
const v=document.getElementById("v"); v.play().catch(()=>{});
// tap or click: go full screen (and start playing if the browser held it back)
addEventListener("click",()=>{ v.play().catch(()=>{}); const d=document.documentElement; if(!document.fullscreenElement&&d.requestFullscreen) d.requestFullscreen().catch(()=>{}); else if(document.exitFullscreen&&document.fullscreenElement) document.exitFullscreen(); });
addEventListener("visibilitychange",()=>{ if(!document.hidden) v.play().catch(()=>{}); });
</script></body></html>
