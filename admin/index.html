<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>프로토타입 성과 대시보드 · Modestry On × NEOUL</title>
<style>
:root{--ink:#191816;--ink2:#6B6862;--line:#DAD7D0;--tile:#F5F4F0;--lime:#DCF25A;--bad:#B3412F;--ok:#2F6B45}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:22px 28px 60px}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}h2{font-size:15px;margin:30px 0 10px;font-weight:700}
.sub{color:var(--ink2);font-size:12.5px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--ink2)}.meta b{color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:14px;padding:12px 14px;background:var(--tile);border-radius:10px}
.filters label{display:grid;gap:3px;font-size:11.5px;color:var(--ink2)}
select,input,button{font:inherit;color:inherit}select,input[type=date],input[type=email],input[type=password]{height:34px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
button{height:34px;padding:0 14px;border:1px solid var(--ink);border-radius:7px;background:#fff;cursor:pointer;font-weight:600}button.pri{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--tile);white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-size:19px;font-weight:700;letter-spacing:-.01em}.frac{display:block;font-size:11.5px;color:var(--ink2);font-weight:400}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap}.tag.ok{background:var(--lime)}.tag.no{background:#EFEDE8;color:var(--ink2)}.tag.na{border:1px dashed var(--ink2);color:var(--ink2)}
.basis{font-size:12px;color:var(--ink2);max-width:420px}
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{border:1px solid var(--line);border-radius:10px;padding:12px 14px}.step .k{font-size:11.5px;color:var(--ink2)}.step .v{font-size:24px;font-weight:700;margin-top:2px}.step .d{font-size:11.5px;color:var(--ink2);margin-top:2px}
.bar{height:6px;background:#EFEDE8;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.warn{margin-top:12px;padding:10px 14px;border:1px solid var(--bad);border-radius:8px;color:var(--bad);font-size:12.5px}
.note{margin-top:12px;padding:10px 14px;background:var(--tile);border-radius:8px;font-size:12.5px;color:var(--ink2)}
.th{width:40px;height:50px;object-fit:cover;border-radius:5px;background:var(--tile);display:block}
#login{max-width:360px;margin:12vh auto;display:grid;gap:10px}#login h1{margin-bottom:6px}
.defs{font-size:12.5px;color:var(--ink2)}.defs dt{color:var(--ink);font-weight:600;margin-top:8px}.defs dd{margin:0}
.testbar{background:var(--bad);color:#fff;text-align:center;padding:6px;font-size:12.5px;font-weight:600}
@media print{@page{size:A4 landscape;margin:10mm}.noprint{display:none!important}.wrap{padding:0;max-width:none}body{font-size:11px}h2{margin-top:14px}th,td{padding:5px 7px}.big{font-size:14px}.step .v{font-size:16px}.funnel,table,tr{break-inside:avoid}}
</style></head><body>
<div id="app"></div>
<script src="https://modestryon.github.io/tryon-service/mo-config.js"></script>
<script>
const TITLE="자사 히잡 10종 라이브 가상착용 AR 웹 SDK 개발", TZ="Asia/Seoul";
const GOAL={products:10, users:500, complete:80, click:20, revenue:50000000};
const q=new URLSearchParams(location.search), LOCAL=/^(localhost|127\.)/.test(location.hostname);
const CFG=(LOCAL&&q.get("api"))?{url:q.get("api"),key:"local"}:(window.MO_TRACK_CONFIG||{url:"",key:""});
const SERVICE=LOCAL&&q.get("svc")?q.get("svc"):"https://modestryon.github.io/tryon-service/", SHOPIMG="https://modestryon.github.io/neoul/img/";
const $=s=>document.querySelector(s), app=$("#app"), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원", num=n=>n.toLocaleString("ko-KR");
const dKST=d=>new Intl.DateTimeFormat("sv-SE",{timeZone:TZ,dateStyle:"short"}).format(d), tKST=d=>new Intl.DateTimeFormat("ko-KR",{timeZone:TZ,dateStyle:"medium",timeStyle:"short"}).format(d);
let TOKEN=null; try{ TOKEN=JSON.parse(sessionStorage.getItem("mo_admin")||"null"); }catch(e){}
let ROWS=[], CAT=null, LOADED=null, ERR=null;
const today=dKST(new Date()), F={from:q.get("from")||"2026-11-01", to:q.get("to")||today, src:q.get("fsrc")||"shop", mode:q.get("fmode")||"camera", env:q.get("fenv")||"prod"};

function loginView(msg){ app.innerHTML=`<form id="login"><h1>프로토타입 성과 대시보드</h1><div class="sub">관리자만 접근할 수 있습니다.</div>
  ${CFG.url?"":'<div class="warn">데이터 저장소가 아직 연결되지 않았습니다 (미연동). 연결 후 로그인할 수 있습니다.</div>'}
  <input type="email" id="em" placeholder="관리자 이메일" autocomplete="username" required><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
  <button class="pri" ${CFG.url?"":"disabled"}>로그인</button>${msg?`<div class="warn">${esc(msg)}</div>`:""}</form>`;
  $("#login").addEventListener("submit",async e=>{ e.preventDefault(); if(!CFG.url) return;
    try{ const r=await fetch(CFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.key},body:JSON.stringify({email:$("#em").value,password:$("#pw").value})});
      const j=await r.json(); if(!r.ok||!j.access_token) return loginView("로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.");
      TOKEN={t:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000,email:$("#em").value}; sessionStorage.setItem("mo_admin",JSON.stringify(TOKEN)); load(); }
    catch(err){ loginView("저장소에 연결하지 못했습니다."); } }); }

async function load(){ if(!TOKEN||TOKEN.exp<Date.now()) return loginView();
  app.innerHTML='<div class="wrap">불러오는 중…</div>'; ERR=null;
  try{ const from=new Date(F.from+"T00:00:00+09:00").toISOString(), to=new Date(new Date(F.to+"T00:00:00+09:00").getTime()+864e5).toISOString(); ROWS=[];
    for(let off=0;;off+=1000){ const r=await fetch(`${CFG.url}/rest/v1/mo_events?select=*&ts=gte.${encodeURIComponent(from)}&ts=lt.${encodeURIComponent(to)}&order=ts.asc`,{headers:{apikey:CFG.key,Authorization:"Bearer "+TOKEN.t,Range:`${off}-${off+999}`,"Range-Unit":"items"}});
      if(r.status===401){ sessionStorage.removeItem("mo_admin"); TOKEN=null; return loginView("로그인이 만료되었습니다."); } if(!r.ok) throw new Error("HTTP "+r.status);
      const a=await r.json(); ROWS.push(...a); if(a.length<1000) break; }
  }catch(e){ ERR=e.message; }
  try{ CAT=await (await fetch(SERVICE+"catalog.json",{cache:"no-store"})).json(); }catch(e){ CAT=null; }
  LOADED=new Date(); draw(); }

function calc(){ const rows=ROWS.filter(r=>r.env===F.env && (F.src==="all"||r.src===F.src));
  const X=new Map(), get=id=>X.get(id)||X.set(id,{enter:null,wear:new Map(),modes:new Set(),click:new Map(),arrive:[],bid:null}).get(id);
  const orders=new Map();
  for(const r of rows){ const x=get(r.xid), t=+new Date(r.ts); x.bid=x.bid||r.bid;
    if(r.event==="tryon_enter") x.enter=x.enter==null?t:Math.min(x.enter,t);
    else if(r.event==="wear_ok"||r.event==="switch_ok"){ if(r.sku&&!x.wear.has(r.sku)) x.wear.set(r.sku,t); if(r.mode) x.modes.add(r.mode); }
    else if(r.event==="detail_click"){ if(r.sku&&!x.click.has(r.sku)) x.click.set(r.sku,t); }
    else if(r.event==="detail_arrive") x.arrive.push({sku:r.sku,sel:r.meta&&r.meta.selected,t});
    else if(/^order_/.test(r.event)&&r.order_id){ const o=orders.get(r.order_id)||orders.set(r.order_id,{xid:r.xid,paid:0,minus:0,sku:r.sku}).get(r.order_id); if(r.event==="order_paid") o.paid=Math.max(o.paid,+r.amount||0); else o.minus+=+r.amount||0; } }
  // a participant = an experience that reached the try-on screen; the mode filter drops only experiences worn solely in the other mode
  const P=[...X.entries()].filter(([id,x])=>x.enter!=null && (F.mode==="all"||!x.modes.size||x.modes.has(F.mode)));
  const ids=new Set(P.map(p=>p[0]));
  const done=x=>x.arrive.some(a=>a.sku&&a.sel===a.sku&&x.wear.has(a.sku)&&x.wear.get(a.sku)<=a.t);
  const worn=P.filter(([,x])=>x.wear.size), clicked=P.filter(([,x])=>x.click.size), arrived=P.filter(([,x])=>done(x));
  const anyArr=P.filter(([,x])=>x.arrive.length), mism=P.filter(([,x])=>x.arrive.some(a=>a.sel&&a.sel!==a.sku));
  const ord=[...orders.values()].filter(o=>ids.has(o.xid)&&o.paid>0), buyers=new Set(ord.map(o=>o.xid));
  const gross=ord.reduce((s,o)=>s+o.paid,0), minus=ord.reduce((s,o)=>s+Math.min(o.minus,o.paid),0);
  const sku={}; const S=k=>sku[k]||(sku[k]={wear:0,click:0,arrive:0,orders:0,net:0});
  for(const [,x] of P){ for(const k of x.wear.keys()) S(k).wear++; for(const k of x.click.keys()) S(k).click++; new Set(x.arrive.filter(a=>a.sel===a.sku).map(a=>a.sku)).forEach(k=>S(k).arrive++); }
  for(const o of ord) if(o.sku){ S(o.sku).orders++; S(o.sku).net+=o.paid-Math.min(o.minus,o.paid); }
  const first=ROWS.filter(r=>r.env===F.env).map(r=>r.ts).sort()[0];
  return {n:P.length, bids:new Set(P.map(p=>p[1].bid)).size, worn:worn.length, clicked:clicked.length, arrived:arrived.length, anyArr:anyArr.length, mism:mism.length, ordN:ord.length, buyers:buyers.size, gross, minus, net:gross-minus, sku, first, total:rows.length, hasOrders:orders.size>0}; }

const pct=(a,b)=>b?((a/b*100).toFixed(1)+"%"):"산출 불가";
function draw(){ const connected=!!CFG.url&&!ERR, c=calc(), prods=CAT?CAT.products:null;
  const st=(ok,na)=>na?`<span class="tag na">${na}</span>`:ok?'<span class="tag ok">달성</span>':'<span class="tag no">미달성</span>';
  const who=F.src==="popup"?"체험 세션":"고유 참여자", basisWho=F.src==="popup"?"현장 공용 기기는 체험 1회를 1명으로 집계 (익명 기기 "+c.bids+"대)":"익명 브라우저 기준 고유 참여자";
  const orderNA=!c.hasOrders&&!(CAT&&CAT.orders==="linked");
  const R=[
   ["가상착용 적용 상품", GOAL.products+"종", prods?`${prods.length}종`:"미집계", prods?st(prods.length>=GOAL.products):st(0,"미집계"), prods?`실제 배포본에서 착용 가능한 고유 상품 수 · 최종 확인 ${esc(CAT.checked)}<br>${prods.map(p=>esc(p.id.toUpperCase())).join(", ")}`:"서비스의 상품 목록을 불러오지 못함"],
   ["고객·사용자 검증", num(GOAL.users)+"명", connected?`${num(c.n)}명`:"미연동", connected?st(c.n>=GOAL.users):st(0,"미연동"), `선택 기간에 체험 화면까지 진입한 ${who} 수 · ${basisWho}`],
   ["가상착용·상품 이동 과제 완료율", GOAL.complete+"% 이상", connected?`${pct(c.arrived,c.n)}<span class="frac">${num(c.arrived)} / ${num(c.n)}명</span>`:"미연동", connected?(c.n?st(c.arrived/c.n*100>=GOAL.complete):st(0,"산출 불가")):st(0,"미연동"), "참여자 중 같은 체험에서 착용 성공 → 선택한 상품의 상세 페이지 도착까지 순서대로 완료한 "+who+" 비율 (선택 상품과 도착 상품 ID 일치)"],
   ["상품 상세 클릭률", GOAL.click+"% 이상", connected?`${pct(c.clicked,c.n)}<span class="frac">${num(c.clicked)} / ${num(c.n)}명</span>`:"미연동", connected?(c.n?st(c.clicked/c.n*100>=GOAL.click):st(0,"산출 불가")):st(0,"미연동"), "참여자 중 체험 화면의 상품 상세 버튼을 한 번 이상 누른 "+who+" 비율"],
   ["SDK 경유 구매매출", won(GOAL.revenue), !connected?"미연동":orderNA?"주문 미연동":`${won(c.net)}<span class="frac">주문 ${num(c.ordN)}건 · 결제 ${won(c.gross)} − 취소·환불 ${won(c.minus)}</span>`, !connected?st(0,"미연동"):orderNA?st(0,"주문 미연동"):st(c.net>=GOAL.revenue), orderNA?"쇼핑몰에 결제·주문 기능이 아직 연결되지 않아 매출을 집계할 수 없음 (현재 장바구니는 화면에만 저장)":"동일 체험에서 쇼핑몰로 돌아온 뒤 연결이 확인된 결제 완료 주문 금액 − 취소·환불액 · 주문번호 기준 중복 제거"]];
  const steps=[["체험 진입",c.n],["착용 성공",c.worn],["상세 클릭",c.clicked],["동일 상품 상세 도착",c.arrived],["결제 완료",orderNA?null:c.buyers]];
  const list=(prods||Object.keys(c.sku).map(id=>({id,name:id}))), srcL={shop:"자사몰에서 시작",direct:"서비스 직접 방문",popup:"팝업·현장 체험",all:"전체"}, modeL={camera:"카메라 촬영(라이브)",model:"모델 사진",all:"전체"}, envL={prod:"운영",test:"내부 테스트",demo:"예시 데이터"};
  app.innerHTML=`${F.env!=="prod"?`<div class="testbar">${envL[F.env]} 데이터를 보고 있습니다 — 운영 실적이 아닙니다</div>`:""}<div class="wrap">
  <div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start"><div><h1>프로토타입 성과 대시보드</h1><div class="sub">과제명: ${TITLE} · Modestry On × NEOUL</div></div>
    <div class="noprint" style="display:flex;gap:8px"><button id="csv1">요약표 CSV</button><button id="csv2">상품별 CSV</button><button id="prt" class="pri">인쇄 / PDF 저장</button></div></div>
  <div class="meta"><span>조회 기간 <b>${F.from} ~ ${F.to}</b></span><span>집계 시간대 <b>한국 표준시 (KST)</b></span><span>유입 경로 <b>${srcL[F.src]}</b></span><span>체험 모드 <b>${modeL[F.mode]}</b></span><span>환경 <b>${envL[F.env]}</b></span>
    <span>데이터 수집 시작 <b>${c.first?tKST(new Date(c.first)):(connected?"수집 기록 없음":"미연동")}</b></span><span>마지막 갱신 <b>${LOADED?tKST(LOADED):"-"}</b></span></div>
  <div class="filters noprint"><label>시작일<input type="date" id="f_from" value="${F.from}"></label><label>종료일<input type="date" id="f_to" value="${F.to}"></label>
    <label>유입 경로<select id="f_src">${Object.entries(srcL).map(([k,v])=>`<option value="${k}"${F.src===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label>체험 모드<select id="f_mode">${Object.entries(modeL).map(([k,v])=>`<option value="${k}"${F.mode===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label>환경<select id="f_env">${Object.entries(envL).map(([k,v])=>`<option value="${k}"${F.env===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <button id="go" class="pri">조회</button><button id="out">로그아웃</button></div>
  ${ERR?`<div class="warn">데이터를 불러오지 못했습니다 (${esc(ERR)}). 아래 수치는 미연동 상태입니다.</div>`:""}
  <h2>성과 요약</h2>
  <table id="sum"><thead><tr><th>지표</th><th class="n">계획 목표</th><th class="n">실제 실적</th><th>달성 여부</th><th>집계 근거</th></tr></thead><tbody>
  ${R.map(r=>`<tr><td><b>${r[0]}</b></td><td class="n">${r[1]}</td><td class="n big">${r[2]}</td><td>${r[3]}</td><td class="basis">${r[4]}</td></tr>`).join("")}</tbody></table>
  ${connected&&c.arrived>c.clicked?`<div class="warn">집계 점검 필요: 과제 완료자(${c.arrived}명)가 상세 클릭자(${c.clicked}명)보다 많습니다. 상세 클릭을 거쳐야 도착할 수 있으므로 클릭 이벤트 누락 여부를 확인하세요.</div>`:""}
  ${connected&&c.mism?`<div class="note">선택한 상품과 다른 상품 페이지에 도착한 체험 ${c.mism}건은 과제 완료에서 제외했습니다.</div>`:""}
  <h2>고객 행동 흐름</h2>
  <div class="funnel">${steps.map((s,i)=>{ const v=s[1], prev=i?steps[i-1][1]:null; return `<div class="step"><div class="k">${i+1}. ${s[0]}</div><div class="v">${!connected?"미연동":v==null?"주문 미연동":num(v)+"명"}</div>
    <div class="d">${!connected||v==null||prev==null?"&nbsp;":prev?`이전 단계 대비 이탈 ${num(prev-v)}명 (${((prev-v)/prev*100).toFixed(1)}%)`:"이전 단계 0명"}</div><div class="bar"><i style="width:${connected&&v!=null&&c.n?v/c.n*100:0}%"></i></div></div>`; }).join("")}</div>
  <h2>상품별 결과</h2>
  <table id="prod"><thead><tr><th></th><th>상품명</th><th>SKU</th><th class="n">착용자 수</th><th class="n">상세 클릭자 수</th><th class="n">상세 도착자 수</th><th class="n">구매 건수</th><th class="n">순매출</th></tr></thead><tbody>
  ${list.map(p=>{ const s=c.sku[p.id]||{wear:0,click:0,arrive:0,orders:0,net:0}, v=x=>connected?num(x):"미연동"; return `<tr><td><img class="th" src="${SHOPIMG}look-${esc(p.id)}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></td><td>${esc(p.name)}</td><td>${esc(p.id.toUpperCase())}</td><td class="n">${v(s.wear)}</td><td class="n">${v(s.click)}</td><td class="n">${v(s.arrive)}</td><td class="n">${orderNA?"주문 미연동":v(s.orders)}</td><td class="n">${orderNA?"주문 미연동":connected?won(s.net):"미연동"}</td></tr>`; }).join("")}</tbody></table>
  <h2>집계 기준</h2>
  <dl class="defs"><dt>참여자</dt><dd>선택 기간·유입 경로·환경에서 가상착용 화면이 실제로 열린 익명 체험. 같은 브라우저의 새로고침·뒤로 가기·반복 클릭은 1명으로 유지되고, 30분 이상 활동이 없으면 새 체험으로 봅니다. 얼굴 이미지·이름·이메일은 저장하지 않습니다.</dd>
  <dt>착용 성공 / 상품 전환</dt><dd>선택한 히잡이 화면에 정상 적용된 시점. 상품 ID와 체험 모드(카메라 촬영·모델 사진)를 함께 기록합니다. 체험 모드 필터는 다른 모드로만 착용한 체험을 제외합니다.</dd>
  <dt>상품 상세 클릭 / 도착</dt><dd>체험 화면의 ‘View on site’ 버튼을 누른 시점과, 쇼핑몰에서 해당 상품 페이지가 실제로 열린 시점. 선택 상품과 도착 상품 ID가 같을 때만 도착으로 인정합니다.</dd>
  <dt>구매 귀속</dt><dd>동일 체험에서 쇼핑몰로 돌아온 뒤 연결이 확인되는 주문만 포함하며, 취소·환불액을 차감합니다.</dd>
  <dt>표시 규칙</dt><dd>정상 수집 중 발생 건수가 없으면 0, 추적 설치 전이거나 연결되지 않은 항목은 미집계·미연동, 분모가 0인 비율은 산출 불가로 표시합니다. 내부 테스트와 예시 데이터는 환경 필터로 분리되어 운영 실적에 포함되지 않습니다.</dd></dl>
  </div>`;
  $("#go").onclick=()=>{ F.from=$("#f_from").value; F.to=$("#f_to").value; F.src=$("#f_src").value; F.mode=$("#f_mode").value; F.env=$("#f_env").value; load(); };
  $("#out").onclick=()=>{ sessionStorage.removeItem("mo_admin"); TOKEN=null; loginView(); };
  $("#prt").onclick=()=>window.print();
  const head=`# ${TITLE}\n# 조회 기간,${F.from} ~ ${F.to}\n# 집계 시간대,KST\n# 유입 경로,${srcL[F.src]}\n# 체험 모드,${modeL[F.mode]}\n# 환경,${envL[F.env]}\n# 마지막 갱신,${LOADED?tKST(LOADED):""}\n`;
  const csv=(id,name)=>{ const rows=[...document.querySelectorAll(`#${id} tr`)].map(tr=>[...tr.children].map(td=>'"'+td.innerText.replace(/\s*\n\s*/g," ").replace(/"/g,'""').trim()+'"').join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+head+rows],{type:"text/csv"})); a.download=`${name}_${F.from}_${F.to}.csv`; a.click(); };
  $("#csv1").onclick=()=>csv("sum","성과요약"); $("#csv2").onclick=()=>csv("prod","상품별결과"); }
load();
</script></body></html>
