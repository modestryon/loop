<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Modestry On</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-400.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-700.woff2) format("woff2")}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;font-family:Outfit,Arial,sans-serif;color:#252820;overflow:hidden}
/* drawn on an 834 × 1194 board and scaled to the screen */
#b{position:absolute;left:50%;top:50%;width:834px;height:1194px;transform-origin:50% 50%;display:flex;flex-direction:column;justify-content:center;padding:46px 54px}
.logo{height:30px;width:auto;align-self:flex-start}
.k{align-self:flex-start;font:700 20px/1 Outfit;letter-spacing:.14em;text-transform:uppercase;color:#252820;display:flex;align-items:center;gap:10px;margin-top:32px;padding:14px 20px;border-radius:13px;background:#DCF25A}
h1{font-weight:700;font-size:74px;line-height:1.0;letter-spacing:-.035em;margin:20px 0 0}
p{font-weight:400;font-size:25px;line-height:1.3;color:#6A6862;margin:18px 0 0;max-width:700px}
p b{font-weight:600;color:#252820}
.mid{flex:0 0 auto;display:flex;gap:26px;align-items:stretch;margin-top:34px;height:594px}
.dev{flex:0 0 auto;position:relative;width:424px;height:594px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px #D8D5CE,0 26px 50px -30px rgba(0,0,0,.3)}
.dev iframe{width:834px;height:1169px;border:0;transform:scale(.5083);transform-origin:0 0;display:block;pointer-events:none}
.dev .cover{position:absolute;inset:0;background:#fff;display:flex;align-items:flex-start;justify-content:center;padding-top:38px;transition:opacity .5s ease}
.dev .cover img{width:58%;border-radius:12px}.dev .cover.off{opacity:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.lab{font:500 13px/1 Outfit;letter-spacing:.16em;text-transform:uppercase;color:#8B8982}
ol{list-style:none;margin:0;padding:0;display:grid;gap:9px}
li{display:flex;align-items:center;gap:12px;font-weight:600;font-size:21px;padding:13px 14px;border-radius:13px;border:1.5px solid #E3E0D9}
li span{font:500 13px/1 Outfit;letter-spacing:.1em;color:#8B8982}
.send{margin-top:auto;background:#F6F5F1;border-radius:20px;padding:20px;box-shadow:0 0 0 1.5px #E3E0D9}
.send h2{font-weight:700;font-size:27px;line-height:1.08;letter-spacing:-.025em;margin:10px 0 0}
.qr{width:128px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 0 0 1.5px #D8D5CE;margin-top:16px}.qr img{display:block;width:100%}
.at{font-weight:600;font-size:21px;margin-top:12px}
.kr{display:flex;gap:8px;margin-top:32px}.kr .k{margin-top:0;font-size:17px;padding:13px 16px;letter-spacing:.12em;white-space:nowrap}.k2{background:#252820!important;color:#DCF25A!important}.k2 span{font-weight:500;color:#fff;letter-spacing:0}.mid{height:740px}.dev{width:528px;height:740px}.dev iframe{transform:scale(0.6331)}.mid{gap:22px}li{font-size:15.5px;padding:10px 9px;gap:7px;white-space:nowrap}li span{font-size:11px}.send{padding:16px}.send h2{font-size:21px}.at{font-size:18px}.lab{font-size:11.5px;letter-spacing:.12em}</style></head><body>
<div id="b">
  <img class="logo" src="logo-mo.png" alt="Modestry On">
  <div class="kr"><div class="k">A service for Muslim women</div><div class="k k2"><span>×</span>K-beauty precision</div></div>
  <h1>Try on a hijab<br>before you buy it.</h1>
  <p style="font-size:27px;white-space:nowrap"><b>One photo.</b> Your colors and how to wear each scarf.</p>
  <div class="mid">
    <div class="dev"><iframe id="app" src="../tryon/demo.html?film=1&notop&only=tryon" title="Modestry On try-on, live"></iframe><div class="cover" id="cover"><img src="d1.jpg" alt=""></div></div>
    <div class="col">
      <div class="lab">How it works</div>
      <ol><li><span>01</span>Take a photo</li><li><span>02</span>Analyze your face</li><li><span>03</span>Try on your hijab</li></ol>
      <div class="send">
        <div class="lab">Don't wear one yourself?</div>
        <h2>Send this to a friend who does.</h2>
        <div class="qr"><img src="qr-instagram.svg" alt="QR code to instagram.com/modestry_on"></div>
        <div class="at">@modestry_on</div>
      </div>
    </div>
  </div>
</div>
<script>
const b=document.getElementById("b"); function fit(){ const k=Math.min(innerWidth/834,innerHeight/1194); b.style.transform=`translate(-50%,-50%) scale(${k})`; } fit(); addEventListener("resize",fit);
addEventListener("message",e=>{ const d=e.data||{}; if(d.mo==="screen"&&d.screen==="tryon") setTimeout(()=>document.getElementById("cover").classList.add("off"),500); });
</script></body></html>
