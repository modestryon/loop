<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Modestry On</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-400.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-700.woff2) format("woff2")}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;font-family:Outfit,Arial,sans-serif;color:#252820;overflow:hidden}
/* drawn on an 834 × 1194 board and scaled to the screen */
#b{position:absolute;left:50%;top:50%;width:834px;height:1194px;transform-origin:50% 50%;display:flex;flex-direction:column;padding:56px 56px 48px}
.logo{height:30px;width:auto;align-self:flex-start}
.k{font:500 15px/1 Outfit;letter-spacing:.18em;text-transform:uppercase;color:#6A6862;display:flex;align-items:center;gap:10px;margin-top:44px}
.k b{width:28px;height:2px;background:#252820;display:inline-block}
h1{font-weight:700;font-size:82px;line-height:1.0;letter-spacing:-.035em;margin:18px 0 0}
p{font-weight:400;font-size:27px;line-height:1.3;color:#6A6862;margin:22px 0 0;max-width:660px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px}
.ph figure{margin:0}.ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;background:#D9DADD}
.ph figcaption{font:500 16px/1 Outfit;margin-top:11px;display:flex;align-items:center;gap:8px}
.ph figcaption i{width:9px;height:9px;border-radius:3px;background:#DCF25A;box-shadow:0 0 0 1.5px #252820}
.same{font:500 14px/1 Outfit;letter-spacing:.16em;text-transform:uppercase;color:#8B8982;margin-top:20px}
.foot{margin-top:auto;display:flex;align-items:center;gap:26px;background:#F6F5F1;border-radius:22px;padding:24px 26px;box-shadow:0 0 0 1.5px #E3E0D9}
.qr{flex:0 0 auto;width:150px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 0 0 1.5px #D8D5CE}.qr img{display:block;width:100%}
.foot h2{font-weight:700;font-size:35px;line-height:1.06;letter-spacing:-.025em;margin:0}
.foot .at{font-weight:600;font-size:23px;margin-top:12px;color:#252820}
.foot small{display:block;font:500 13px/1 Outfit;letter-spacing:.16em;text-transform:uppercase;color:#8B8982;margin-bottom:10px}
</style></head><body>
<div id="b">
  <img class="logo" src="logo-mo.png" alt="Modestry On">
  <div class="k"><b></b>Virtual hijab try-on</div>
  <h1>Try on a hijab<br>before you buy it.</h1>
  <p>Made for women who wear the hijab. One photo shows the colors that suit you and five ways to wear each scarf.</p>
  <div class="ph">
    <figure><img src="d1.jpg" alt=""><figcaption><i></i>Tied front</figcaption></figure>
    <figure><img src="d3.jpg" alt=""><figcaption><i></i>Chest cover</figcaption></figure>
    <figure><img src="d5.jpg" alt=""><figcaption><i></i>Neck tuck</figcaption></figure>
  </div>
  <div class="same">Same face · same scarf · three drapes</div>
  <div class="foot">
    <div class="qr"><img src="qr-instagram.svg" alt="QR code to instagram.com/modestry_on"></div>
    <div><small>Don't wear one yourself?</small><h2>Send this to a friend<br>who does.</h2><div class="at">@modestry_on</div></div>
  </div>
</div>
<script>
const b=document.getElementById("b"); function fit(){ const k=Math.min(innerWidth/834,innerHeight/1194); b.style.transform=`translate(-50%,-50%) scale(${k})`; } fit(); addEventListener("resize",fit);
</script></body></html>
