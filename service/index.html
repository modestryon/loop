<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modestry On · Hijab Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One tall iPad-portrait column. Stone surface, ink type, lime only on the selected state and the main action. */
:root{color-scheme:light;--bg:#EEECE8;--card:#FFFFFF;--ink:#161614;--ink2:#6A6862;--line:#D8D5CE;--lime:#D7F36B;
  --font:Outfit,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{max-width:834px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;display:inline-flex;align-items:center}
.logo i{display:inline-block;width:.74em;height:.74em;border:.17em solid currentColor;border-radius:50%;margin:0 .04em 0 .24em}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:8px 24px 28px;gap:18px}
h1{font-size:clamp(36px,6.6vw,56px);line-height:1.03;font-weight:600;letter-spacing:-.03em;margin:0;text-wrap:balance}
h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15}
p{margin:0;color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:18px;padding:0 28px;text-decoration:none;text-align:center}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:46px;font-size:16px;padding:0 18px}
.row{display:flex;gap:12px}.row>*{flex:1}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--ink)}
.stagewrap{position:relative;width:100%;max-width:560px;align-self:center}
canvas.stage{display:block;width:100%;aspect-ratio:4/5;border-radius:22px;background:#D9DADD;touch-action:none}
.chip{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.card{background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.pal{display:flex;gap:8px}.pal span{flex:1;height:40px;border-radius:10px}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tabs{display:flex;background:#E2DFD9;border-radius:999px;padding:4px}
.tabs button{flex:1;min-height:44px;border-radius:999px;font-weight:600;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--card)}
.opts{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.opt{flex:0 0 84px;border-radius:14px;background:var(--card);border:2px solid transparent;overflow:hidden;padding:4px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--lime)}
.opt img{display:block;width:100%;aspect-ratio:4/5;object-fit:contain}
.sw{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px 0 6px;border-radius:999px;background:var(--card);border:2px solid transparent;font-size:14px;font-weight:500;white-space:nowrap}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.sw b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--lime);border-radius:999px;padding:2px 7px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;background:#E2DFD9;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{font-size:13px;color:var(--ink2)}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.ctrl input{width:100%;accent-color:var(--ink)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--card);font-size:22px;font-weight:600;line-height:1}
.hint{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}.hint span::before{content:"";display:inline-block;width:12px;height:3px;background:#B7D63A;vertical-align:middle;margin-right:6px}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.ring{width:72px;height:72px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cardimg{display:block;width:100%;max-width:380px;align-self:center;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.follow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.scan li{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ink2)}
.scan li::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.scan li.on{color:var(--ink)}.scan li.on::before{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.scan li.done{color:var(--ink)}.scan li.done::before{background:var(--lime);border-color:var(--lime);animation:none}
:root{--hh:52px}
header{gap:8px}
.hl,.hr{display:flex;align-items:center;gap:10px}
.nav{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:3px;box-shadow:0 0 0 1px var(--line)}
.nav:disabled{opacity:.3}
.hr .tag{white-space:nowrap}
@media (max-height:720px){ .res .card{padding:11px 14px;gap:5px} .res p{font-size:13px} .res .lab{font-size:10.5px} .res>.note{display:none} main.fit h2{font-size:21px} .res .big{font-size:20px} }
/* ---- one-screen layouts: result + try-on ---- */
main.fit{overflow:hidden;gap:10px;padding-bottom:14px}
.res .card{padding:14px 16px;gap:7px}
.res .big{font-size:22px}
.res p{font-size:14px;line-height:1.35}
.res .pal span{height:26px;border-radius:8px}
.res .pills{gap:6px;flex-wrap:nowrap}
.res .pill{min-height:32px;padding:0 11px;font-size:13px;flex:1}
.res .card.setup{flex-direction:row;align-items:center;gap:12px}
.res .setup i{width:44px;height:44px;border-radius:10px;flex:none}
.res .grow{flex:1;min-height:0}
.res .note{font-size:12px}
.try{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.try .stagebox{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
.try .stagebox canvas{height:100%;width:auto;max-width:100%;aspect-ratio:4/5;border-radius:20px;background:#D9DADD;display:block}
.try .chipwrap{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.try .chipwrap>div{position:relative;height:100%;aspect-ratio:4/5;max-width:100%}
.try .chipwrap .chip{left:10px;top:10px;font-size:11.5px;padding:5px 10px;max-width:calc(100% - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.try .chipwrap .ra{position:absolute;right:10px;top:10px;white-space:nowrap;pointer-events:auto;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600}
.try .row1{display:flex;gap:8px;align-items:stretch}
.try .tabs{flex:none}
.try .tabs button{min-height:44px;font-size:14px}
.try .lab{font-size:10.5px}
.try .opts{gap:8px}
.try .opt{flex:0 0 64px;padding:3px 3px 5px;border-radius:12px;gap:2px}
.try .opt span{font-size:10px}
.try .fab{flex:0 0 60px;font-size:10.5px;gap:3px}
.try .fab i{width:60px;height:46px;border-radius:9px}
.try .fab u{top:3px;left:3px;font-size:8.5px;padding:1px 5px}
.try .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.try .acts .btn{min-height:50px;font-size:16px}
.try .acts .site{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--card);border-radius:999px;text-decoration:none;color:var(--ink);line-height:1.15;box-shadow:inset 0 0 0 1.5px var(--ink)}
.try .acts .site small{font:500 9.5px var(--mono);letter-spacing:.1em;color:var(--ink2)}
.try .acts .site .nl{font-size:15px;letter-spacing:.28em}
 .pal8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal8 span{height:26px;border-radius:8px}
.res .card.best{flex-direction:row;align-items:center;gap:14px}
.res .best img{width:64px;height:80px;object-fit:contain;background:#ECEBE7;border-radius:10px;flex:none}
.res .best b{display:block;font-size:20px;letter-spacing:-.02em;margin:2px 0 4px}
.res .best .sub{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
.res .best .sub i{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.try .framewrap{position:relative;height:100%;display:flex}
.try .collabv{position:absolute;left:100%;bottom:0;margin-left:8px;writing-mode:vertical-rl;transform:rotate(180deg);font:500 10px var(--mono);letter-spacing:.18em;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:8px}
.try .collabv .nl{font-size:13px;letter-spacing:.26em;color:var(--ink);font-family:var(--font)}
.try .col{width:100%;max-width:340px;align-self:center;display:flex;flex-direction:column;gap:10px;text-align:center}
.try .col .lab{display:block;text-align:center}
.try .col .opts{justify-content:center;margin-top:6px;overflow:visible;flex-wrap:nowrap}
.try .fab{align-items:center;text-align:center}
.try .acts .btn{min-height:48px}
.hide{display:none!important}
:root{--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
body.full header{display:none}
body.full main{padding:0}
/* ---- pre-intro film ---- */
.film{position:fixed;inset:0;background:#FFFFFF;z-index:50;overflow:hidden;cursor:pointer}
.film .skip{position:absolute;right:22px;top:20px;z-index:5;font:500 12px var(--mono);letter-spacing:.12em;color:var(--ink2);padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.7)}
.film .bar{position:absolute;left:24px;right:24px;top:24px;display:flex;gap:6px;z-index:4;max-width:420px}
.film .bar i{flex:1;height:3px;border-radius:3px;background:rgba(22,22,20,.12);overflow:hidden;position:relative}
.film .bar i b{position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0;transition:opacity .5s ease;padding:70px 28px 40px}
.scene.on{opacity:1}
.scene .cap{text-align:center}
.scene .cap span{font:500 13px var(--mono);letter-spacing:.16em;color:var(--ink2)}
.scene .cap h3{margin:6px 0 0;font-size:clamp(34px,6vw,54px);font-weight:700;letter-spacing:-.035em;line-height:1}
.frame{position:relative;width:min(62vw,420px);aspect-ratio:4/5;border-radius:26px;overflow:hidden;background:#D9DADD;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame svg{position:absolute;inset:0;width:100%;height:100%}
.scanline{position:absolute;left:0;right:0;height:3px;background:#D7F36B;box-shadow:0 0 22px 6px rgba(215,243,107,.7);top:0}
.scene.on .scanline{animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
.scene.on .dots circle{animation:pop .5s both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.chips{display:flex;gap:10px}
.chips i{width:58px;height:58px;border-radius:14px;opacity:0;transform:translateY(16px)}
.scene.on .chips i{animation:rise .5s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.xfade img{opacity:0;transition:opacity .25s}.xfade img.on{opacity:1}
.tagline{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.slotwrap{position:relative;width:min(62vw,420px);aspect-ratio:3/4;border-radius:22px;overflow:hidden}
.slotwrap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slotwrap .strip{position:absolute;left:36.5%;width:27%;top:29%;height:66%;overflow:hidden}
.slotwrap .strip img{width:100%;transform:translateY(-100%)}
.scene.on .slotwrap .strip img{animation:print 2.2s .3s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes print{to{transform:translateY(0)}}
.shopcard{width:min(62vw,380px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.shopcard img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.shopcard div{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.shopcard b{font-size:16px}
.shopcard .add{min-height:48px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.scene.on .shopcard .add{animation:tapit 2.4s forwards}
@keyframes tapit{0%,45%{transform:none;background:var(--ink)}52%{transform:scale(.95)}60%,100%{transform:none;background:#D7F36B;color:var(--ink)}}
.scene.on .shopcard .add::after{content:"Add to bag";}
/* ---- intro (switch) ---- */
.intro{flex:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;cursor:pointer;padding:40px 24px;background:#fff}
.wordmark{display:flex;flex-direction:column;align-items:center;font-weight:800;letter-spacing:-.055em;line-height:.86;font-size:clamp(96px,22vw,190px);color:#111110}
.wordmark .on{display:flex;align-items:flex-end;gap:.04em}
.switch{width:.42em;height:.74em;border-radius:.21em;background:#C9C8C2;position:relative;transition:background .5s ease .5s;margin-bottom:-.18em}
.switch i{position:absolute;left:.05em;width:.32em;height:.32em;border-radius:50%;background:#fff;bottom:.05em;transition:bottom .7s cubic-bezier(.5,0,.2,1) .5s,background .4s ease 1.1s,box-shadow .4s ease 1.1s}
.intro.go .switch{background:#111110}
.intro.go .switch i{bottom:.37em;background:#DCF25A;box-shadow:0 0 0 .05em rgba(220,242,90,.35),0 0 .3em .06em rgba(220,242,90,.8)}
.intro .n{color:#C9C8C2;transition:color .4s ease 1.1s}.intro.go .n{color:#111110}
.slogan{text-align:center;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(8px);transition:all .6s ease 1.5s}
.intro.go .slogan{opacity:1;transform:none}
.slogan b{font-size:clamp(22px,3.4vw,30px);letter-spacing:-.02em}
.slogan span{color:var(--ink2);font-size:16px}
.tapcue{font:500 12px var(--mono);letter-spacing:.2em;color:#B5B3AD;opacity:0;transition:opacity .6s ease 2s}
.intro.go .tapcue{opacity:1;animation:blink 2.4s ease-in-out 2.6s infinite}
@keyframes blink{50%{opacity:.35}}
/* ---- start ---- */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.how div{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.how span{font:500 11px var(--mono);letter-spacing:.1em;color:var(--ink2)}
.how b{font-size:15px;line-height:1.2}
.shutter{display:flex;align-items:center;justify-content:center;gap:40px;padding:6px 0 4px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.sbtn .ic{width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line)}
.sbtn.main .ic{width:96px;height:96px;background:#fff;box-shadow:0 0 0 5px var(--ink),inset 0 0 0 9px #fff,inset 0 0 0 60px var(--lime)}
.sbtn svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.8}
/* ---- scan list ---- */
.scan.mono{grid-template-columns:repeat(4,1fr);gap:6px}
#scan.scan.mono{grid-template-columns:repeat(3,1fr)}
.scan.mono li{flex-direction:column;align-items:flex-start;gap:6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.scan.mono li::before{width:100%;height:3px;border-radius:3px;border:0;background:var(--line)}
.scan.mono li.on::before{background:linear-gradient(90deg,var(--ink) 50%,var(--line) 50%);background-size:200% 100%;animation:fill 1.6s linear infinite}
@keyframes fill{from{background-position:100% 0}to{background-position:0 0}}
.scan.mono li.done::before{background:var(--ink)}
/* ---- try-on ---- */
.tabs button small{display:block;font:500 11px var(--mono);color:var(--ink2);letter-spacing:.04em;margin-top:1px}
.tabs button{min-height:54px;line-height:1.15}
.opt{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 4px 8px}
.opt span{font-size:11.5px;font-weight:600;line-height:1.15;text-align:center}
.fab{flex:0 0 88px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12.5px;line-height:1.2;position:relative}
.fab i{width:88px;height:88px;border-radius:12px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.fab[aria-pressed="true"] i{border-color:var(--ink);box-shadow:inset 0 0 0 3px #fff}
.fab b{font-weight:600}.fab em{font-style:normal;color:var(--ink2)}
.fab u{position:absolute;top:6px;left:6px;text-decoration:none;font:600 9.5px var(--mono);letter-spacing:.08em;background:var(--lime);border-radius:999px;padding:2px 6px}
.collab{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:20px;padding:14px 16px 14px 20px}
.collab .l{display:flex;flex-direction:column;gap:2px}
.collab .l>span:first-child{font:500 11px var(--mono);letter-spacing:.12em;color:var(--ink2)}
.nl{font-weight:600;letter-spacing:.32em;font-size:20px;display:inline-flex;align-items:center}
img.nl{height:.74em!important;width:auto;display:inline-block;margin:0!important;vertical-align:middle;flex:none}
.nl .e3{display:inline-block;width:.54em;height:.71em;margin-right:.32em;background:linear-gradient(180deg,currentColor 0 .07em,transparent .07em calc(50% - .035em),currentColor calc(50% - .035em) calc(50% + .035em),transparent calc(50% + .035em) calc(100% - .07em),currentColor calc(100% - .07em))}
.collab .btn{white-space:nowrap;min-height:42px;font-size:15px;padding:0 16px}
.collab .l>span:first-child{white-space:nowrap}
.stagewrap.compact{max-width:min(560px,calc(56vh * .8))}
.hint{display:none}
@media (max-width:520px){
  header{padding:14px 18px} main{padding:4px 18px 24px;gap:14px}
  h2{font-size:24px}
  .how{grid-template-columns:repeat(2,1fr)}
  .card{padding:16px;border-radius:18px}
  .big{font-size:23px}
  .pal span{height:32px}
  .fab{flex-basis:76px}.fab i{width:76px;height:76px}
  .opt{flex-basis:82px}
  .sbtn.main .ic{width:88px;height:88px}
  .shutter{gap:32px}
}
.linkbtn{font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px;align-self:center;padding:8px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v3 result + try-on */
.btn.next{text-transform:uppercase;letter-spacing:.08em}
.res{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.res .card.pc{flex:1.25 1 0;min-height:min-content}
.res .card.pc .pal8{flex:1;grid-template-rows:1fr 1fr;min-height:60px;max-height:150px}
.res .card.pc .pal8 span{height:auto;min-height:26px}
.res .card.pc .pal8.p16{grid-template-rows:repeat(4,1fr);min-height:116px;max-height:340px}
.res .card.pc .pal8.p16 span{min-height:22px}

let faReady=null;
function initFA(){
  if (faReady) return faReady;

    const tf=faceapi.tf;
    try{ await tf.setBackend("webgl"); }catch(e){ await tf.setBackend("cpu"); }
    await tf.ready();
    const wm = m => tf.io.decodeWeights(Uint8Array.from(atob(m.b64),c=>c.charCodeAt(0)).buffer, m.weights);
    await faceapi.nets.tinyFaceDetector.loadFromWeightMap(wm(FA_MODELS.tiny));
    await faceapi.nets.faceLandmark68Net.loadFromWeightMap(wm(FA_MODELS.lm));
    return true;
  })();

}

function delaunay(P){

    const uy=((a[0]**2+a[1]**2)*(c[0]-b[0])+(b[0]**2+b[1]**2)*(a[0]-c[0])+(c[0]**2+c[1]**2)*(b[0]-a[0]))/d; return [ux,uy,(a[0]-ux)**2+(a[1]-uy)**2];};

    for(const t of tris){ const [ux,uy,r2]=cc(t); ((x-ux)**2+(y-uy)**2<r2?bad:keep).push(t); }
